name: Build and verify

on:
  push:
    branches: [develop, master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: nn-approximations/pom.xml
      - name: Verify including desktop smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" mvn -B -ntp -f nn-approximations/pom.xml clean verify -Djavafx.smoke=true -Dprism.order=sw
      - name: Verify including desktop smoke tests (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: mvn -B -ntp -f nn-approximations/pom.xml clean verify -Djavafx.smoke=true -Dprism.order=sw
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            nn-approximations/target/surefire-reports/
            nn-approximations/target/site/jacoco/
          if-no-files-found: warn
